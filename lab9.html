<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        
    </style>
</head>
<body>
    <img src = "shoo1.JPG" id = "zurag" width="250px" height="250px"/>
    <h1>Тоглогч1</h1>
    <h1 id = "niilber"></h1>
    <button id="shoo1" onclick = "Дарах()">Шоо хаях</button>

    <br></br>
    <img src = "shoo1.jpg" id = "zurag1" width="250px" height="250px" />
    <h1>Тоглогч2</h1>
    <h1 id = "dun"></h1>
    <button id="shoo2" onclick = "Хаях()">Шоо хаях</button>


    <script>
        let towch1 = document.getElementById("shoo1");
        let towch2 = document.getElementById("shoo2");
        let darahToo = 0;
        let darahtoo = 0;
        let shoo = document.getElementById("zurag");
        let count = 0;
        let chount = 0;
        let culuu = document.getElementById("zurag1");


        function Дарах() {
            too = Math.floor(Math.random()*6)+1;
            count += too;
            shoo.src = "shoo" + too + ".jpg";
            document.getElementById("niilber").innerHTML = count;
            darahToo += 1;
            if(darahToo == 3) {
                towch1.style.display="none";
            }
        }

        function Хаях() {
            too = Math.floor(Math.random()*6)+1;
            chount += too;
            culuu.src = "shoo" + too + ".jpg";
            document.getElementById("dun").innerHTML = chount;
            darahtoo += 1;
            if(darahtoo == 3) {
                towch2.style.display="none";
            }
        }

   
    </script>
</body>
</html>
